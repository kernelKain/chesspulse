<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a0a6"/></marker></defs><rect width="1600" height="600" fill="#0e1012"/><text x="800" y="60" font-size="38" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">From a session to a report</text><text x="800" y="98" font-size="18" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Dashed lines are optional. Only PGNs and summary numbers reach the AI provider.</text><text x="60" y="140" font-size="18" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace">DURING PLAY</text><rect x="60" y="150" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="180.0" y="190" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Camera</text><text x="180.0" y="220" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">your webcam</text><rect x="360" y="150" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="480.0" y="190" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SmartSpectra SDK</text><text x="480.0" y="220" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">pulse, on this computer</text><rect x="660" y="150" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="780.0" y="190" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pulse samples</text><text x="780.0" y="220" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">bpm, confidence, stable</text><rect x="960" y="150" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="1080.0" y="190" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Coverage gate</text><text x="1080.0" y="220" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">usable readings, 70%</text><line x1="300" y1="200" x2="360" y2="200" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="600" y1="200" x2="660" y2="200" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="900" y1="200" x2="960" y2="200" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><text x="60" y="335" font-size="18" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace">AFTER YOU STOP</text><rect x="60" y="345" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="180.0" y="385" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pasted PGNs</text><text x="180.0" y="415" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">moves, clocks, result</text><rect x="360" y="345" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="480.0" y="385" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Stockfish 19</text><text x="480.0" y="415" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">depth 12, scored locally</text><rect x="660" y="345" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="780.0" y="385" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Align and band</text><text x="780.0" y="415" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">game marks, 10 bpm rule</text><rect x="960" y="345" width="240" height="100" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="1080.0" y="385" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Accuracy per band</text><text x="1080.0" y="415" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">under 5 moves: Insufficient</text><line x1="300" y1="395" x2="360" y2="395" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="600" y1="395" x2="660" y2="395" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="900" y1="395" x2="960" y2="395" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="1080" y1="250" x2="780" y2="345" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><rect x="1260" y="180" width="280" height="300" rx="10" fill="#0e1012" stroke="#5ac8d8" stroke-width="3"/><text x="1400" y="222" font-size="24" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Report</text><text x="1400" y="268" font-size="19" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">timeline</text><text x="1400" y="302" font-size="19" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">verdict</text><text x="1400" y="336" font-size="19" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Move Quality</text><text x="1400" y="370" font-size="19" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">between-games note</text><text x="1400" y="430" font-size="16" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Every number computed locally</text><line x1="1200" y1="395" x2="1260" y2="395" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><rect x="660" y="500" width="240" height="80" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2" stroke-dasharray="8 6"/><text x="780.0" y="540" font-size="22" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI explanation</text><text x="780.0" y="570" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">INFERRED text, optional</text><line x1="900" y1="540" x2="1300" y2="480" stroke="#98a0a6" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><line x1="780" y1="445" x2="780" y2="500" stroke="#98a0a6" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/></svg>