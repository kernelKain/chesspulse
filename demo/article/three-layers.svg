<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a0a6"/></marker></defs><rect width="1600" height="860" fill="#0e1012"/><text x="800" y="70" font-size="40" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Three layers, one report</text><text x="800" y="108" font-size="22" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Each layer gives one kind of evidence. Layers 1 and 2 feed the report numbers.</text><rect x="60" y="150" width="470" height="430" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><rect x="90" y="180" width="56" height="56" rx="28" fill="#5ac8d8" stroke="#5ac8d8" stroke-width="2"/><text x="118" y="219" font-size="30" fill="#0e1012" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">1</text><text x="165" y="205" font-size="34" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pulse</text><text x="165" y="240" font-size="18" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">While you play, on this computer</text><text x="94" y="300" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="120" y="300" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Camera opens through the SDK</text><text x="94" y="356" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="120" y="356" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Each reading has a confidence score</text><text x="94" y="412" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="120" y="412" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Baseline: median of the first 60 s</text><text x="94" y="468" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="120" y="468" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Coverage: share of usable readings</text><text x="94" y="524" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="120" y="524" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Under 70% coverage, no report</text><rect x="565" y="150" width="470" height="430" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><rect x="595" y="180" width="56" height="56" rx="28" fill="#5ac8d8" stroke="#5ac8d8" stroke-width="2"/><text x="623" y="219" font-size="30" fill="#0e1012" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">2</text><text x="670" y="205" font-size="34" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Game review</text><text x="670" y="240" font-size="18" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">After you stop, Stockfish 19 at depth 12</text><text x="599" y="300" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="625" y="300" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pasted PGNs scored move by move</text><text x="599" y="356" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="625" y="356" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Centipawn loss per move, by band</text><text x="599" y="412" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="625" y="412" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Elevated: 10 bpm above baseline</text><text x="599" y="468" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="625" y="468" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Band under 5 moves: Insufficient</text><text x="599" y="524" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="625" y="524" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Games placed on the timeline by marks</text><rect x="1070" y="150" width="470" height="430" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><rect x="1100" y="180" width="56" height="56" rx="28" fill="#161a1d" stroke="#5ac8d8" stroke-width="2"/><text x="1128" y="219" font-size="30" fill="#5ac8d8" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">3</text><text x="1175" y="205" font-size="34" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Explanation</text><text x="1175" y="240" font-size="18" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Optional, only when you press Generate</text><text x="1104" y="300" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="1130" y="300" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sends question, PGNs and summaries</text><text x="1104" y="356" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="1130" y="356" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Never sends video or raw pulse</text><text x="1104" y="412" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="1130" y="412" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Reply is labelled INFERRED</text><text x="1104" y="468" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="1130" y="468" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Numbers not in the report are withheld</text><text x="1104" y="524" font-size="26" fill="#5ac8d8" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">•</text><text x="1130" y="524" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">No API key, no request</text><rect x="420" y="650" width="760" height="150" rx="10" fill="#161a1d" stroke="#5ac8d8" stroke-width="3"/><text x="800" y="710" font-size="34" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Report</text><text x="800" y="750" font-size="22" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Timeline · verdict · Move Quality · between-games note</text><text x="800" y="782" font-size="22" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Every number here is computed locally</text><line x1="295" y1="580" x2="560" y2="650" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="800" y1="580" x2="800" y2="650" stroke="#5ac8d8" stroke-width="3" marker-end="url(#arr)"/><line x1="1305" y1="580" x2="1040" y2="650" stroke="#98a0a6" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/><text x="1300" y="650" font-size="20" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">on request</text></svg>