<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98a0a6"/></marker></defs><rect width="1600" height="900" fill="#0e1012"/><text x="800" y="60" font-size="38" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">How the app is built</text><text x="800" y="96" font-size="21" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The main process owns the camera, the files and the engine. The page only draws.</text><rect x="60" y="130" width="640" height="560" rx="10" fill="#161a1d" stroke="#5ac8d8" stroke-width="2"/><text x="90" y="170" font-size="28" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Main process  (Node.js)</text><text x="90" y="200" font-size="19" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Trusted. Holds the API keys and the camera.</text><rect x="90" y="230" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="108" y="270" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Session controller</text><text x="108" y="302" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">starts, marks and stops sessions</text><rect x="390" y="230" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="408" y="270" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SDK capture</text><text x="408" y="302" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SmartSpectra SDK, camera</text><rect x="90" y="365" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="108" y="405" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Session store</text><text x="108" y="437" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">~/.local/share/chesspulse</text><rect x="390" y="365" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="408" y="405" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Analysis</text><text x="408" y="437" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">bands, coverage, alignment</text><rect x="90" y="500" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="108" y="540" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Engine worker</text><text x="108" y="572" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Stockfish 19 in a worker</text><rect x="390" y="500" width="270" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="408" y="540" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI adapter</text><text x="408" y="572" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">native fetch, key from .env</text><rect x="90" y="630" width="580" height="42" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="380" y="658" font-size="18" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">File log: redacted, no PGNs, samples or keys</text><rect x="900" y="130" width="640" height="560" rx="10" fill="#161a1d" stroke="#262c31" stroke-width="2"/><text x="930" y="170" font-size="28" fill="#e9e7e3" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Renderer  (React, sandboxed)</text><text x="930" y="200" font-size="19" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">No Node access. No camera access. No keys.</text><rect x="930" y="230" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1065" y="266" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Home</text><rect x="1230" y="230" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1365" y="266" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Setup</text><rect x="930" y="302" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1065" y="338" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sensing</text><rect x="1230" y="302" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1365" y="338" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Paste PGNs</text><rect x="930" y="374" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1065" y="410" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Review</text><rect x="1230" y="374" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1365" y="410" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sessions</text><rect x="930" y="446" width="270" height="56" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="1065" y="482" font-size="21" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Help</text><rect x="930" y="510" width="580" height="160" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2"/><text x="950" y="548" font-size="19" fill="#e9e7e3" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Shows only what the main process sends.</text><text x="950" y="582" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The preview is a small copy of the SDK's own video</text><text x="950" y="608" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">output, so the camera is never opened twice.</text><text x="950" y="642" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sensing starts only after camera consent.</text><rect x="712" y="380" width="176" height="110" rx="10" fill="#0e1012" stroke="#5ac8d8" stroke-width="2"/><text x="800" y="415" font-size="19" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace">contextBridge</text><text x="800" y="442" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">IPC, schema-</text><text x="800" y="466" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">checked, one table</text><line x1="700" y1="425" x2="712" y2="425" stroke="#5ac8d8" stroke-width="3"/><line x1="888" y1="425" x2="900" y2="425" stroke="#5ac8d8" stroke-width="3"/><line x1="888" y1="475" x2="900" y2="475" stroke="#5ac8d8" stroke-width="3"/><rect x="60" y="730" width="300" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2" stroke-dasharray="8 6"/><text x="210" y="770" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Presage servers</text><text x="210" y="800" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">API key and subscription check only</text><rect x="400" y="730" width="300" height="110" rx="8" fill="#0e1012" stroke="#262c31" stroke-width="2" stroke-dasharray="8 6"/><text x="550" y="770" font-size="21" fill="#e9e7e3" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI provider (optional)</text><text x="550" y="800" font-size="17" fill="#98a0a6" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Only after you press Generate</text><line x1="210" y1="730" x2="210" y2="692" stroke="#98a0a6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/><line x1="550" y1="730" x2="550" y2="692" stroke="#98a0a6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="800" y="878" font-size="20" fill="#e9e7e3" font-weight="400" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Nothing else leaves this computer.</text></svg>