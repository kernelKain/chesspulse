<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- ChessPulse mark: a pulse line across a board square.
       What: a 4x4 board pattern under a single measured pulse line.
       Why: the product is the pulse and the board on one timeline, in one shape.
       Colours are the token values from tokens.css; an <img> cannot read CSS variables. -->
  <defs>
    <pattern id="board" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#d8d0c0" opacity="0.16" />
      <rect width="5" height="5" fill="#55636b" opacity="0.42" />
      <rect x="5" y="5" width="5" height="5" fill="#55636b" opacity="0.42" />
    </pattern>
  </defs>
  <rect width="48" height="48" rx="10" fill="#161a1d" />
  <rect x="4.5" y="4.5" width="39" height="39" rx="6" fill="url(#board)" stroke="#262c31" />
  <!-- The dark casing keeps the line legible where it crosses the light squares. -->
  <path
    d="M7 27h8l4-13l5 22l5-15l3 6h9"
    fill="none"
    stroke="#0e1012"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M7 27h8l4-13l5 22l5-15l3 6h9"
    fill="none"
    stroke="#5ac8d8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
